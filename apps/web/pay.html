<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pay with SHIB · ShibPayment</title>
  <link rel="icon" href="/shib-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/site.css" />
  <style>
    main { min-height: calc(100vh - 72px); display: grid; place-items: center; padding: 24px 0 64px; }
    .box { width: 100%; max-width: 420px; text-align: center; }
    .box .price { font-size: 44px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 6px; }
    .box shib-pay { margin-top: 18px; }
    .trust { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 20px; font-size: 12px; color: var(--faint); }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="wordmark" href="/" style="--wm:20px"><img src="/shib-logo.png" alt="" /><span><span>Shib</span><span class="pay">Payment</span></span></a>
      <span class="faint" style="font-size:13px">Secure checkout</span>
    </nav>
    <main><div class="card box" id="box"></div></main>
  </div>
  <script type="module" src="/src/pay.ts"></script>
</body>
</html>
